name: Market Briefing Bot V2

on:
  schedule:
    - cron: '15 19 * * *'
    - cron: '15 2 * * *'
    - cron: '45 8 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests matplotlib

      - run: python main.py
